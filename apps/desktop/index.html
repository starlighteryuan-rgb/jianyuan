<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>见渊</title>
    <script>
      // Apply the persisted appearance before first paint so System/Light/Dark
      // never flash the wrong surface. Explicit choices win; system stays unset.
      try {
        var t = localStorage.getItem('jianyuan.appearance.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
