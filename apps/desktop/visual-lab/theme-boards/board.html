<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>见渊 Paired Theme Board</title>
<style>
/* ============================================================
   见渊 Phase 10A - Paired Theme Board template
   NON-PRODUCTION research artifact.

   Dark and Light columns are cloned from the SAME screen
   templates, so layout / typography / spacing / geometry are
   identical by construction. Only semantic token values differ.
   ============================================================ */

/* ---------- shared, theme-independent design system ---------- */
:root {
  --font-display: "Noto Serif SC", "Source Han Serif SC", Georgia, "Songti SC", serif;
  --font-body: "Segoe UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: Consolas, "Cascadia Mono", "JetBrains Mono", monospace;

  /* spacing scale (4px base) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;

  /* geometry */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --nav-w: 190px;
  --read-max: 620px;

  /* type scale */
  --t-eyebrow: 11px; --t-meta: 11.5px; --t-body: 13.5px;
  --t-lead: 15px; --t-h2: 15px; --t-h1: 25px;
  --lh-body: 1.75; --lh-h1: 1.3;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #0b0b0a;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   BOARD CHROME (the board itself, not the product)
   ============================================================ */
.board {
  width: 2400px;
  padding: 56px 48px 72px;
  background: #0b0b0a;
}

.board-head { margin-bottom: 40px; }
.board-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: #8b8478; margin: 0 0 14px;
}
.board-title {
  font-family: var(--font-display);
  font-size: 46px; font-weight: 600; letter-spacing: -.01em;
  color: #f2ece0; margin: 0 0 10px;
}
.board-sub {
  font-size: 15px; line-height: 1.7; color: #a49c8d;
  margin: 0; max-width: 1100px;
}
.board-feel {
  display: grid; grid-template-columns: 1fr 1fr; gap: 32px;
  margin-top: 28px; max-width: 1500px;
}
.feel-card {
  border-left: 2px solid #3a342b; padding: 4px 0 4px 20px;
}
.feel-card b {
  display: block; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: #8b8478;
  font-weight: 500; margin-bottom: 8px;
}
.feel-card span {
  font-family: var(--font-display); font-size: 19px; line-height: 1.6;
  color: #ddd5c6;
}

/* section label between screen rows */
.sec-label {
  display: flex; align-items: baseline; gap: 16px;
  margin: 52px 0 20px;
}
.sec-label h2 {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; color: #9d9484; margin: 0;
}
.sec-label .sec-note { font-size: 12.5px; color: #6e6759; margin: 0; }
.sec-label .rule { flex: 1; height: 1px; background: #241f18; }

/* two theme columns */
.pair {
  display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  align-items: start;
}
.col-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.col-head .tag {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em;
  text-transform: uppercase; color: #9d9484;
}
.col-head .name { font-size: 13px; color: #6e6759; }

/* ============================================================
   PRODUCT MOCK - uses ONLY semantic tokens
   ============================================================ */
.app {
  width: 100%;
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  overflow: hidden;
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
  color: var(--text-primary);
}

/* ---- title bar (window chrome) ---- */
.titlebar {
  grid-column: 1 / -1;
  height: 34px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
.dotctl { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.titlebar .win-title {
  margin-left: 8px; font-size: 11.5px; color: var(--text-muted);
  letter-spacing: .04em;
}

/* ---- sidebar navigation ---- */
.nav {
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  padding: 22px 14px 18px;
  display: flex; flex-direction: column; gap: 26px;
  min-height: 520px;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 0 8px; }
/* Small Brand Mark: outer ring + inner ring + center point + vertical axis.
   Optical simplification of the 512px app icon: no glow, no metal, no gradient.
   Same geometry at 24/28/32px; stroke widths step down for small sizes. */
.brand-mark {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--accent-primary);
}
.brand-mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.brand-mark .bm-axis { stroke: currentColor; stroke-width: 1.1; opacity: .45; }
.brand-mark .bm-ring-outer { stroke: currentColor; stroke-width: 1.6; opacity: .9; }
.brand-mark .bm-ring-inner { stroke: currentColor; stroke-width: 1.1; opacity: .5; }
.brand-mark .bm-core { fill: currentColor; }

/* size variants keep legibility by thinning the axis first */
.brand-mark.bm-24 { width: 24px; height: 24px; }
.brand-mark.bm-24 .bm-axis { opacity: .35; }
.brand-mark.bm-32 { width: 32px; height: 32px; }
.brand-name {
  font-family: var(--font-display); font-size: 15px; font-weight: 600;
  letter-spacing: .06em; color: var(--text-primary);
}

.nav-group { display: grid; gap: 3px; }
.nav-item {
  display: grid; gap: 3px; width: 100%;
  padding: 10px 11px;
  border: 0; border-left: 2px solid transparent;
  border-radius: 0 var(--r-md) var(--r-md) 0;
  background: transparent; text-align: left; cursor: pointer;
  color: var(--text-secondary);
}
.nav-item strong { font-size: 13.5px; font-weight: 500; letter-spacing: .02em; }
.nav-item span { font-size: 11px; line-height: 1.45; color: var(--text-muted); }
.nav-item.is-active {
  border-left-color: var(--accent-primary);
  background: var(--bg-elevated);
  color: var(--text-primary);
}
.nav-item.is-active strong { font-weight: 600; }
.nav-secondary { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-subtle); }

.nav-status {
  display: grid; gap: 5px; padding: 12px 11px 0;
  border-top: 1px solid var(--border-subtle);
}
.nav-status .k {
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-muted); font-family: var(--font-mono);
}
.nav-status .v { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); }
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

/* ---- main area ---- */
.main {
  position: relative;
  padding: 40px 48px 56px;
  background: var(--bg-canvas);
  min-height: 520px;
  isolation: isolate;
}

/* The dense repeating-radial-gradient mesh was removed: at any real density it
   reads as a topographic / parametric grid, which is exactly what 见渊 is not.
   Water is now expressed by a few large-span arcs, per screen, in .wave-layer. */
.main > *:not(.wave-layer) { position: relative; z-index: 1; }

/* 记录 and 设置 intentionally carry no background curve. */
.page-head { max-width: var(--read-max); margin-bottom: 34px; }
.eyebrow {
  margin: 0 0 10px; font-family: var(--font-mono); font-size: var(--t-eyebrow);
  letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted);
}
.page-head h1 {
  margin: 0 0 12px; font-family: var(--font-display);
  font-size: var(--t-h1); font-weight: 600; line-height: var(--lh-h1);
  letter-spacing: -.005em; color: var(--text-primary);
}
.page-head p {
  margin: 0; font-size: var(--t-lead); line-height: 1.75; color: var(--text-secondary);
}

/* generic section inside main */
.block { max-width: var(--read-max); }
.block + .block { margin-top: 38px; }
.block-h {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 16px; margin-bottom: 16px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-subtle);
}
.block-h h2 {
  margin: 0; font-size: var(--t-h2); font-weight: 600; letter-spacing: .01em;
  color: var(--text-primary);
}
.block-h .count {
  font-family: var(--font-mono); font-size: var(--t-meta); color: var(--text-muted);
}

/* composer */
.composer { display: grid; gap: 12px; }
.composer label {
  font-size: 12.5px; color: var(--text-secondary); letter-spacing: .01em;
}
.composer textarea {
  width: 100%; min-height: 96px; resize: none;
  padding: 14px 15px;
  font-family: var(--font-display); font-size: 15px; line-height: 1.8;
  color: var(--text-primary);
  /* The writing surface sits slightly BELOW the page: a recessed paper well,
     not a white card. Same token in both themes. */
  background: var(--bg-sunken);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, var(--well-shadow));
}
.composer textarea:focus { outline: none; border-color: var(--border-strong); }
.composer textarea::placeholder { color: var(--text-muted); }
.composer-actions { display: flex; align-items: center; gap: 12px; }
.btn {
  padding: 9px 18px; font-size: 13px; font-weight: 500; letter-spacing: .01em;
  border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer;
  /* CTA uses its own, slightly darker token so it reads as clickable
     without out-shining the user's own text. */
  background: var(--accent-cta); color: var(--btn-fg);
}
.btn:hover { background: var(--accent-primary); }
.btn:active { background: var(--accent-cta); }
.btn:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

.btn.ghost {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border-subtle);
}
.btn.ghost:hover { border-color: var(--border-strong); color: var(--text-primary); background: transparent; }
.btn.ghost:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }

/* Destructive / dismissive AI actions stay quieter than the user's own actions. */
.btn.quiet-ai {
  background: transparent; color: var(--text-muted);
  border-color: var(--border-subtle); font-weight: 400;
}
.btn.quiet-ai:hover { color: var(--text-secondary); border-color: var(--border-strong); }
.composer-hint { font-size: 11.5px; line-height: 1.6; color: var(--text-muted); opacity: .85; }

/* search row */
.search {
  display: flex; gap: 10px; align-items: center;
}
.search input {
  flex: 1; padding: 9px 13px; font-size: 13px;
  color: var(--text-primary); background: var(--bg-sunken);
  border: 1px solid var(--border-subtle); border-radius: var(--r-md);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, var(--well-shadow));
}
.search input:focus { outline: none; border-color: var(--border-strong); }
.search input::placeholder { color: var(--text-muted); }

/* ---- record timeline: 点 = 一段经历 ---- */
.timeline { display: grid; }
.rec {
  display: grid; grid-template-columns: 22px minmax(0, 1fr);
  gap: 14px; padding: 15px 0;
  border-bottom: 1px solid var(--border-hair);
}
.rec:last-child { border-bottom: 0; }
.rec-rail { position: relative; display: flex; justify-content: center; padding-top: 6px; }
.rec-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-muted);
  z-index: 1;
}
.rec.is-seen .rec-dot {
  background: var(--accent-primary);
  /* the ring itself is .rec-ring; the dot only needs to separate from the rail */
  box-shadow: 0 0 0 1px var(--bg-canvas);
}
.rec.is-stable .rec-dot {
  background: var(--accent-primary);
  box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 3.5px var(--accent-primary);
}
.rec-rail::before {
  content: ""; position: absolute; top: -15px; bottom: -15px; left: 50%;
  width: 1px; background: var(--border-hair);
}
.rec:first-child .rec-rail::before { top: 6px; }
.rec:last-child .rec-rail::before { bottom: auto; height: 16px; }

.rec-body { min-width: 0; }
.rec-text {
  margin: 0 0 7px; font-family: var(--font-display);
  font-size: 14.5px; line-height: 1.8; color: var(--text-primary);
}
.rec-meta {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: var(--t-meta); color: var(--text-muted);
}
.rec-meta .sep { color: var(--border-strong); }
.rec-tag {
  font-family: var(--font-body); font-size: 10.5px; letter-spacing: .06em;
  padding: 2px 7px; border-radius: 999px;
  border: 1px solid var(--accent-soft-strong);
  color: var(--accent-primary);
}

/* ---- observation card: AI 临时观察，视觉权重低于用户文字 ---- */
.obs {
  position: relative;
  padding: 22px 26px 20px;
  /* Observation sits on the recessed surface, one step below user content.
     One corner settles further than the rest: a contour that reads as an arc
     rather than as a box, without becoming decorative. */
  background: var(--bg-sunken);
  border: 1px solid var(--border-hair);
  border-radius: var(--r-lg) var(--r-lg) 26px var(--r-lg);
  max-width: var(--read-max);
}
.obs::before {
  content: ""; position: absolute; inset: -1px;
  border-radius: var(--r-lg) var(--r-lg) 26px var(--r-lg);
  background: var(--awareness-glow);
  pointer-events: none; opacity: var(--glow-opacity);
}
.obs > * { position: relative; }
.obs-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ring {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1px solid var(--accent-primary); opacity: .38;
  position: relative;
}
.ring::after {
  content: ""; position: absolute; inset: 3.5px; border-radius: 50%;
  border: 1px solid var(--accent-primary); opacity: .42;
}
.obs-kind {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .13em; text-transform: uppercase; color: var(--text-muted);
  opacity: .8;
}
.obs-temp {
  margin-left: auto; font-size: 10.5px; color: var(--text-muted);
  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border-hair);
  opacity: .85;
}
.obs h3 {
  margin: 4px 0 6px; font-family: var(--font-body);
  font-size: 14px; font-weight: 500; color: var(--text-secondary);
  letter-spacing: .01em;
}
.obs-note {
  margin: 0 0 20px; font-size: 12.5px; line-height: 1.7; color: var(--text-muted);
}
.obs-part { padding: 14px 0; border-top: 1px solid var(--border-hair); }
.obs-part h4 {
  margin: 0 0 9px; font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; font-weight: 400;
  color: var(--text-muted); opacity: .85;
}
.obs-part p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--text-secondary); }
.quote {
  margin: 0; padding: 3px 0 3px 14px;
  border-left: 1px solid var(--border-strong);
  font-family: var(--font-display); font-size: 14px; line-height: 1.8;
  color: var(--text-primary);
}
.quote + .quote { margin-top: 10px; }
.obs-question {
  margin: 0; padding: 11px 14px;
  background: var(--bg-surface); border-radius: var(--r-md);
  border-left: 2px solid var(--border-strong);
  font-family: var(--font-display); font-size: 13.5px; line-height: 1.75;
  color: var(--text-secondary);
}
.obs-cta { margin-top: 20px; display: flex; gap: 10px; }

/* ---- user reflection: 用户原话 = 视觉主体，衬线，最大 ---- */
.refl-quote {
  margin: 0 0 14px;
  font-family: var(--font-display); font-size: 21px; line-height: 1.72;
  font-weight: 500; letter-spacing: -.005em;
  color: var(--text-primary);
}
.refl-src {
  display: grid; gap: 10px; padding: 14px 0 0;
  border-top: 1px solid var(--border-hair);
}
.refl-src .k {
  font-family: var(--font-mono); font-size: var(--t-eyebrow); letter-spacing: .13em;
  text-transform: uppercase; color: var(--text-muted);
}
.refl-src .v {
  font-size: 12.5px; line-height: 1.75; color: var(--text-secondary);
}

/* reflection focus state: AI recedes, user text leads */
.focus-stack { display: grid; gap: 22px; max-width: var(--read-max); }
.focus-ai {
  opacity: var(--ai-recede);
  padding: 15px 18px;
  background: var(--bg-sunken);
  border: 1px solid var(--border-hair);
  border-left: 2px solid var(--border-subtle);
  border-radius: var(--r-md);
}
.focus-ai .lbl {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--font-mono); font-size: var(--t-eyebrow);
  letter-spacing: .13em; text-transform: uppercase; color: var(--text-muted);
}
.focus-ai p { margin: 0; font-size: 12.5px; line-height: 1.75; color: var(--text-secondary); }
.focus-user {
  padding: 24px 26px;
  /* User reflection is the only raised, lit surface on this screen.
     Its settling corner mirrors the observation card, so the two read as
     one family while the user surface stays the brighter of the pair. */
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-left: 2px solid var(--reflection-focus);
  border-radius: var(--r-md) 20px var(--r-md) var(--r-md);
  box-shadow: var(--shadow-focus);
}
.focus-user .lbl {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  font-family: var(--font-mono); font-size: var(--t-eyebrow);
  letter-spacing: .13em; text-transform: uppercase; color: var(--accent-primary);
}
.focus-user-text {
  margin: 0; min-height: 118px;
  font-family: var(--font-display); font-size: 17px; line-height: 1.85;
  color: var(--text-primary);
}
.focus-user .caret {
  display: inline-block; width: 1.5px; height: 19px; vertical-align: -3px;
  background: var(--reflection-focus); margin-left: 2px;
}
.focus-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--border-hair);
}
.focus-foot .note { font-size: 11.5px; color: var(--text-muted); }

/* ---- exploration: 稳定轨道 + 轨迹 + provenance ---- */
.conn {
  position: relative;
  display: grid; grid-template-columns: 34px minmax(0,1fr);
  gap: 16px; padding: 20px 0;
  border-bottom: 1px solid var(--border-hair);
}
.conn:last-child { border-bottom: 0; }
.conn-rail { position: relative; display: flex; justify-content: center; padding-top: 3px; }
.orbit {
  width: 19px; height: 19px; border-radius: 50%;
  border: 1px solid var(--relation-line);
  display: grid; place-items: center; z-index: 1;
  background: var(--bg-canvas);
  /* stable orbit: a second, fainter ring marks a relation the user has taken part in */
  box-shadow: 0 0 0 4px var(--bg-canvas), 0 0 0 5px var(--wave-ring);
}
.orbit i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary); }
/* rail is now the .rail-curve SVG: a very slight S instead of a hard rule */
.conn:first-child .conn-rail::before { top: 3px; }
.conn:last-child .conn-rail::before { bottom: auto; height: 22px; }
.conn-body { min-width: 0; }
.conn-title {
  margin: 0 0 6px; font-family: var(--font-display);
  font-size: 16px; font-weight: 500; line-height: 1.55; color: var(--text-primary);
}
.conn-ev { margin: 0 0 12px; font-size: 12.5px; line-height: 1.8; color: var(--text-secondary); }
.conn-participation {
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 10px; font-family: var(--font-mono); font-size: var(--t-meta);
  color: var(--text-muted); letter-spacing: .04em;
}
.conn-participation i {
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent-primary); opacity: .7;
}
.prov {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px;
  font-family: var(--font-mono); font-size: var(--t-meta); color: var(--text-muted);
}
.prov .chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border-subtle); background: var(--bg-surface);
}
.prov .chip i { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); }
.span-line {
  display: flex; align-items: center; gap: 9px; margin-top: 11px;
  font-family: var(--font-mono); font-size: var(--t-meta); color: var(--text-muted);
}
/* A shallow downward sag: time continuing, then settling inward.
   Drawn with a border arc so it stays a curve, not a straight rule. */
/* superseded by .span-curve (SVG) so the sag is a real smooth curve */

/* ---- settings (compact, functional) ---- */
.set-row {
  display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 18px;
  padding: 13px 0; border-bottom: 1px solid var(--border-hair);
  align-items: center;
}
.set-row:last-child { border-bottom: 0; }
.set-row .k { font-size: 12.5px; color: var(--text-secondary); }
.set-row .v { font-size: 12.5px; color: var(--text-primary); }
.seg {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--bg-surface); border: 1px solid var(--border-subtle);

/* ============================================================
   SPEC STRIP (typography / tokens / north-star marks)

  border: 1px solid #241f18; border-radius: var(--r-lg);

/* ---- wave language detail board ---- */
.wave-board {

.wave-stage {
  position: relative; overflow: hidden;
  border: 1px solid #241f18; border-radius: 12px;
  background: #161512;
  min-height: 230px;
  padding: 26px 28px;
}
.wave-stage.paper { background: #f5f1e8; border-color: #ddd5c4; }
/* Same sparse, large-span arcs the real screens use: two discrete rings per
   origin, wide spacing, low contrast. Never a repeating mesh. */
.wave-stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(circle at 86% -22%, transparent 0 132px, rgba(212,164,100,0.085) 132px 133px, transparent 133px),
    radial-gradient(circle at 86% -22%, transparent 0 208px, rgba(212,164,100,0.05) 208px 209px, transparent 209px),

.mi .spec { font-size: 12px; color: #8b8478; line-height: 1.75; display: block; }

/* ---- 渊 water language: sparse large-span arcs, not a mesh ---- */
.wave-layer {
  position: absolute; inset: 0;
  z-index: 0; pointer-events: none;
  overflow: hidden;
}
.wave-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* vector-effect keeps hairline weight identical in both themes and at any size */
.wave-svg path {
  fill: none;
  vector-effect: non-scaling-stroke;
}
.wave-a { stroke: var(--wave-stroke-a); stroke-width: 1.15; }
.wave-b { stroke: var(--wave-stroke-b); stroke-width: 1; }

/* Ripples are real circles, sized in px so no viewBox scaling can flatten them.
   Both share one centre, so they read as one ripple settling outward. */
.wave-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--wave-stroke-a);
  pointer-events: none;
}
.wave-ring.is-outer { border-color: var(--wave-stroke-b); }

/* Dark may carry the faintest bloom; Light relies on tone difference only. */
[data-theme="dark"] .wave-a,
[data-theme="dark"] .wave-ring { filter: drop-shadow(0 0 6px var(--wave-bloom)); }
[data-theme="light"] .wave-a,
[data-theme="light"] .wave-ring { filter: none; }

/* Dim the arcs across the reading column so long-form text stays calm, but never
   erase them: the convergence point is the meaning, so it must stay perceptible.
   记录 carries no arc at all, so it needs no mask. */
.main[data-wave="reflection"] .wave-layer {
  mask-image: linear-gradient(to right, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.5) 46%, black 78%);
}
.main[data-wave="exploration"] .wave-layer {
  mask-image: linear-gradient(to bottom, black 0%, black 72%, transparent 100%);
}

/* 探索: rail between long-term connections, a very slight S instead of a rule */
.rail-curve {
  position: absolute; top: -20px; bottom: -20px; left: 50%;
  width: 24px; margin-left: -12px;
  pointer-events: none;
}
.rail-curve path {
  fill: none; stroke: var(--relation-line); stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.conn:first-child .rail-curve { top: 3px; }
.conn:last-child .rail-curve { bottom: auto; height: 22px; }

/* 探索: time span as a smooth sagging curve */
.span-curve { width: 100%; max-width: 150px; height: 12px; display: block; }
.span-curve path {
  fill: none; stroke: var(--relation-line); stroke-width: 1.2;
  vector-effect: non-scaling-stroke;
}

/* 记录: a settled ring on a record that has been looked back at */
.rec-ring {

      return `<div class="sw"><i style="background:${val}"></i><span><span class="n">${name} · ${side}</span><span class="hex">${esc(display)}</span></span></div>`;
    }).join('');
    probe.remove();
    return html;
  };
  tk.innerHTML = `
    <h3>Semantic tokens · Dark</h3>
    <div class="swatches">${buildSwatches('dark')}</div>

    </div>`;
  board.appendChild(lg);
}

{
